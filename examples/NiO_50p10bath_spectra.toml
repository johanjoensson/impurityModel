# Ni in NiO -- L2,3 spectra from a fitted bath: 50 valence + 10 conduction bath states.
# Replaces scripts/run_Ni_NiO_50p10bath.sh.
#
# Run with:   mpirun -n <ranks> impurityModel run examples/NiO_50p10bath_spectra.toml

[format]
version = [1, 0]

[units]
energy = "eV"

[hamiltonian.file]
# A legacy labelled .pickle: it records no bath layout, so the counts below cannot be
# deduced and have to be written out. A self-describing .h0 would supply them.
path = "../h0/h0_NiO_50p10bath.pickle"

[[shell]]
l = 1
role = "core"
nominal_occupation = 6
soc = 11.629
# n_bath is omitted: no Hamiltonian is read for the core shell, so it has no fitted bath.
# Set it if you do want core bath states -- the default is a default, not a restriction.

[[shell]]
l = 2
role = "valence"
n_bath = 60
n_valence_bath = 50
# 50, not the 10 that scripts/run_Ni_NiO_50p10bath.sh passed as --nValBaths. The Hamiltonian
# has exactly 50 bath orbitals below the Fermi level and 10 above it, so 10 mislabelled forty
# occupied orbitals as empty conduction states.
nominal_occupation = 8
soc = 0.096

[interaction.slater]
F_vv = [7.5, 0.0, 9.9, 0.0, 6.6]
F_cc = [0.0, 0.0, 0.0]
F_cv = [8.9, 0.0, 6.8]
G_cv = [0.0, 5.0, 0.0, 2.8]

[many_body_basis]
# This model needs its basis bounded, and that is physics, not a workaround. With 50 valence
# and 10 conduction bath orbitals, the default excitation_budget of 4 admits roughly C(50,4) x
# C(10,4) bath excitations per impurity configuration -- of order 1e9 determinants -- and the
# basis build is killed by the OOM killer long before the RAM-derived cap can apply. A budget
# of 2 with an explicit determinant cap gives 11,576 determinants and E0 = -903.98 eV.
#
# Validate the budget on this system before trusting a production number: 4 is the measured
# lossless default for the smaller workloads, not for this one.
excitation_budget = 2
truncation_threshold = 300000

[double_counting.mlft]
c = 1.5

[spectroscopy]

[spectroscopy.pes]
enabled = true

[spectroscopy.xps]
enabled = true

[spectroscopy.xas]
enabled = true

[spectroscopy.rixs]
enabled = true

[spectroscopy.nixs]
enabled = true
radial_file = "../radialOrbitals/Ni3d.dat"
