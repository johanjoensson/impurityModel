# Ni in NiO -- dynamical impurity susceptibilities chi(w) and chi(i nu).
# There was no shell script for this either.
#
# Run with:   mpirun -n <ranks> impurityModel run examples/NiO_susceptibility.toml

[format]
version = [1, 0]

[units]
energy = "eV"

[hamiltonian.file]
path = "../h0/h0_NiO_10bath.pickle"

[[shell]]
l = 2
role = "valence"
n_bath = 10
n_valence_bath = 10
nominal_occupation = 8

[interaction.slater]
F_vv = [7.5, 0.0, 9.9, 0.0, 6.6]

[susceptibility]
cluster = "NiO"
n_psi_max = 5

[susceptibility.real_axis]
enabled = true
mesh = { min = -5.0, max = 5.0, n = 501 }
broadening = 0.01

[susceptibility.matsubara]
# Bosonic, and it includes nu = 0 -- the Van Vleck term.
enabled = true
n_points = 64
