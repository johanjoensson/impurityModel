[project]
name = "impurityModel"
description = "Package for solving the Anderson impurity model."
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
readme="README.md"
license = "MIT"
license-files = ["LICEN[CS]E*"]
dependencies = [
"bitarray",
"h5py",
"matplotlib",
"mpi4py",
"numpy>2.0.0",
"scipy",
"sympy",
]
dynamic = ["version"]

[project.optional-dependencies]
dev = [
    "black",
    "cython-lint",
    "mypy",
    "pytest",
    "pytest-mpi",
    "ruff",
]
doc = [
    "myst-parser",
    "numpydoc",
    "sphinx",
    "sphinx-autodoc-typehints",
    "sphinx-rtd-theme",
]

[project.urls]
Homepage = "https://github.com/johanjoensson/impurityModel/"
Issues = "https://github.com/johanjoensson/impurityModel//issues"


[build-system]
# scipy is a build-time dependency: BlockLanczosArray.pyx does
# `from scipy.linalg.cython_blas cimport zgemm`, so Cython needs scipy's
# cython_blas.pxd present when compiling (not just at runtime).
requires = ["setuptools >= 77.0.3", "setuptools-scm", "cython", "numpy", "scipy"]
build-backend = "_build_backend"
backend-path = ["."]

[tool.setuptools_scm]

[project.scripts]
impurityModel="impurityModel.scripts.cli:main"
plot_RIXS="impurityModel.scripts.plot_RIXS:main"
plot_spectra="impurityModel.scripts.plot_spectra:main"

[tool.coverage.run]
# Record source paths relative to the repo root. Without this, an editable
# `src/` install records absolute paths (/home/runner/work/...), which Coveralls
# cannot map back to the repository and ends up reporting empty/incorrect coverage.
relative_files = true
# Measure the library, not the test suite. Test modules were ~65% of the measured
# statements, so an opt-in benchmark (never run in CI) *lowered* the headline figure and
# turned the Coveralls status red on a commit that only added tests. The wildcard form
# matches however the path is recorded (cwd differs under `mpiexec bash -c`).
omit = ["*/impurityModel/test/*"]

[tool.pytest.ini_options]
testpaths = ["src/impurityModel"]
# `-m "not benchmark and not branch_matrix_full"` keeps performance benchmarks (and the full
# GF branch-matrix product, whose pairwise covering array already runs in the gate) out of
# standard/CI runs; run them explicitly with `pytest -m benchmark` (a command-line -m overrides
# this default).
#
# `-rf` names every failure in the short summary: the runs that need it most are the ones
# nobody is watching (a flake under `mpiexec -n 2` was once carried across three sessions
# undiagnosed because the log only said "1 failed"). The non-root rank files
# (`.pytest_mpi_rank*.out`) get the summary too. `X` names every XPASS for the same reason: a
# `strict=False` xfail exists so that a cell which starts passing surfaces.
addopts = '-m "not benchmark and not branch_matrix_full" -rfX'
filterwarnings = [
    "error",
    # pytest's own _pytest.pathlib.find_prefixed leaves an os.scandir iterator unclosed; under
    # our forced gc.collect() teardown it is finalized at a nondeterministic time, turning this
    # ResourceWarning into a hard error even though every test passed. Scoped to this message.
    "ignore:unclosed scandir iterator:ResourceWarning",
]
markers = [
    "mpi: marker for MPI tests",
    "benchmark: performance/timing benchmark; skipped by default, run with -m benchmark",
    "branch_matrix_full: full cartesian GF branch matrix (test_gf_branch_matrix.py); skipped by default, run with -m branch_matrix_full",
]

[tool.mypy]
namespace_packages = true
allow_redefinition = true
# The bodies of untyped functions are deliberately unchecked (this is not a typed code base);
# the note mypy prints for every annotated local inside one is noise, not a finding.
disable_error_code = ["annotation-unchecked"]

[[tool.mypy.overrides]]
module = ["matplotlib.*", "h5py.*", "scipy.*", "mpi4py.*", "sympy.*"]
ignore_missing_imports = true

# Compiled Cython/C++ extension modules ship no type stubs or py.typed marker, so mypy cannot
# analyze them. Treat them like the third-party libraries above.
[[tool.mypy.overrides]]
module = [
    "impurityModel.ed.BiCGSTAB", "impurityModel.ed.BlockLanczos", "impurityModel.ed.BlockLanczosArray",
    "impurityModel.ed.BlockLanczosCore", "impurityModel.ed.SparseScatter", "impurityModel.ed.GMRES",
    "impurityModel.ed.ManyBodyUtils", "impurityModel.ed.TSQR",
]
ignore_missing_imports = true

[tool.black]
line-length = 120
# Pin the target so Black's output is deterministic regardless of the running
# interpreter. Without this, Black auto-detects a newer Python and warns that the
# CI interpreter "cannot parse code formatted for Python 3.x". CI runs 3.11.
target-version = ["py311"]

[tool.ruff]
line-length = 120

lint.select = ["E", "F", "B", "C4", "PL", "A", "SIM", "RUF", "PGH", "I"]

lint.ignore = [
    "B905", "PLR2004", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "SIM105",
    "RUF005", "PGH003", "C408", "SIM118", "E741", "PLR5501",
    # PLR0917 (too-many-positional-arguments, ruff >= 0.17): the same judgement as PLR0913
    # above -- the solver entry points take many positional parameters by design.
    "PLR0917",
    # PLC0415 (import-outside-top-level): function-local imports are used
    # deliberately here to break import cycles required by the layering rule in
    # CLAUDE.md (e.g. solvers importing physics/symmetries lazily) and to keep
    # test modules self-contained. Enforcing top-level imports would fight that
    # design, so the rule is disabled project-wide.
    "PLC0415",
]
