# Runs at every `git commit` (after `pre-commit install`) and in CI via
# `pre-commit run --all-files` (see .github/workflows/lint.yml). This is the
# single source of truth for formatting/linting, so local and CI never drift.
repos:
  - repo: https://github.com/psf/black-pre-commit-mirror
    # Pin the version so a new Black release (which can change the stable
    # formatting style) cannot break commits/CI on otherwise-unchanged code.
    # Bump deliberately, then re-run `pre-commit run --all-files`.
    rev: 26.5.1
    hooks:
      - id: black
        # line-length 120 and target-version py311 come from [tool.black] in
        # pyproject.toml.

  # cython-lint (MarcoGorelli/cython-lint) was dropped: its "imported but
  # unused" check doesn't resolve Cython's `include` directive (so it flags
  # names that are genuinely used in a textually-included .pxi, e.g. via
  # BlockLanczos.pyx's `include "_lanczos_step.pxi"`) and doesn't respect
  # either `# noqa` or the `import x as x` explicit re-export idiom (tested
  # directly against both). BlockLanczosCore.pyx/BlockLanczosArray.pyx/
  # BlockLanczos.pyx deliberately re-export a large shared-layer surface
  # (search those files for "re-exported here" / "pure re-export") so every
  # existing `from impurityModel.ed.BlockLanczos(Core|Array) import ...` site
  # keeps resolving -- against that pattern the tool produces ~40 permanent,
  # unfixable false positives with no working suppression mechanism, which is
  # worse than no check at all (a red Lint job nobody can act on trains
  # everyone to ignore it). Genuine dead imports/pycodestyle issues it found
  # were fixed once (see git history); watch for new dead code in .pyx files
  # via code review instead.
