# Ni in NiO -- L2,3 XAS/RIXS from a crystal-field parametrisation.
# Replaces scripts/run_Ni_NiO_CF.sh.
#
# Run with:   mpirun -n <ranks> impurityModel run examples/NiO_CF_spectra.toml

[format]
version = [1, 0]

[units]
# Required, with no default: the command line defaults to eV and RSPt writes Rydberg.
energy = "eV"

[hamiltonian.crystal_field]
e_imp = -1.31796
e_deltaO_imp = 0.60422
e_val_eg = -4.4
e_val_t2g = -6.5
e_con_eg = 3.0
e_con_t2g = 2.0
v_val_eg = 1.883
v_val_t2g = 1.395
v_con_eg = 0.6
v_con_t2g = 0.4

[[shell]]
l = 1
role = "core"
nominal_occupation = 6
soc = 11.629

[[shell]]
l = 2
role = "valence"
n_bath = 10
n_valence_bath = 10
nominal_occupation = 8
soc = 0.096

[interaction.slater]
F_vv = [7.5, 0, 9.9, 0, 6.6]
F_cc = [0.0, 0.0, 0.0]
F_cv = [8.9, 0, 6.8]
G_cv = [0, 5.0, 0, 2.8]

[double_counting.mlft]
c = 1.5

# --- Cost (measured, 4 MPI ranks, OPENBLAS_NUM_THREADS=1) --------------------------------
# d8, 149 determinants, 3 retained states. ~60 s on 4 ranks
# (PES 27 s, XPS 24 s, XAS 0.3 s, RIXS 3 s).
#
# Which spectrum dominates DEPENDS ON SIZE, so there is no single lever. PES and XPS dominate
# the small cases -- 572 s of CoO's 676 s, against 66 s for RIXS -- but RIXS overtakes them as
# the basis grows: at FeO it is 8870 s against 4349 s for PES and XPS together, and at MnO it
# is what exhausts memory. Cost also tracks the retained-state count, not just the determinant
# count, since RIXS work is per eigenstate.
#
# Each spectrum has its own switch below, so the expensive one can be dropped:
# `[spectroscopy.rixs] enabled = false` is the lever for the large fillings, and
# `[spectroscopy.pes] / [spectroscopy.xps]` for the small ones. Turning PES and XPS off took
# NiO's 10-bath model from minutes to 7 seconds.

[spectroscopy]
# NOTE: run_Ni_NiO_CF.sh passed --nPsiMax, which run_spectra does not read -- the number of
# eigenstates is derived from the temperature. It is therefore not expressible here, rather
# than expressed and ignored.

[spectroscopy.pes]
enabled = true

[spectroscopy.xps]
enabled = true

[spectroscopy.xas]
enabled = true

[spectroscopy.rixs]
enabled = true

[spectroscopy.nixs]
enabled = false
# radial_file = "../radialOrbitals/Ni3d.dat"   # required when enabled
