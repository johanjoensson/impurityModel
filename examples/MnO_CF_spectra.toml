# Mn in MnO -- L2,3 XAS/RIXS from a crystal-field parametrisation.
# Replaces scripts/run_Mn_MnO_CF.sh.
#
# Run with:   mpirun -n <ranks> impurityModel run examples/MnO_CF_spectra.toml

[format]
version = [1, 0]

[units]
# Required, with no default: the command line defaults to eV and RSPt writes Rydberg.
energy = "eV"

# WARNING: the four conduction-bath parameters below were NOT set in
# h0/h0_MnO_CF.json. That file sets six of the ten parameters, and the reader
# fills each absent one from a hard-coded Ni-in-NiO value -- so every MnO run
# ever done with it silently used Ni's conduction bath. They are written out here
# so the inheritance is visible. They are UNVERIFIED for MnO.
[hamiltonian.crystal_field]
e_imp = -0.463
e_deltaO_imp = 0.638
e_val_eg = -4.8
e_val_t2g = -6.7
e_con_eg = 3.0   # inherited from Ni, unverified
e_con_t2g = 2.0   # inherited from Ni, unverified
v_val_eg = 1.91
v_val_t2g = 1.408
v_con_eg = 0.6   # inherited from Ni, unverified
v_con_t2g = 0.4   # inherited from Ni, unverified

[[shell]]
l = 1
role = "core"
nominal_occupation = 6
soc = 6.936

[[shell]]
l = 2
role = "valence"
n_bath = 10
n_valence_bath = 10
nominal_occupation = 5
soc = 0.051

[interaction.slater]
F_vv = [6, 0, 9.0, 0, 6.1]
F_cc = [0.0, 0.0, 0.0]
F_cv = [7.5, 0, 5.6]
G_cv = [0, 4, 0, 2.3]

[double_counting.mlft]
c = 1.5

# --- Cost (measured, 4 MPI ranks, OPENBLAS_NUM_THREADS=1) --------------------------------
# d5, 4812 determinants, 6 retained states. DOES NOT FIT in 15 GB:
# OOM-killed inside RIXS after 3 h 13 m on 4 ranks (3.0 GB per rank; kernel OOM, not a
# timeout). It had got through PES, XPS and XAS -- a stack sample taken while it ran showed
# it inside the RIXS solve, which runs last -- but the archive was being written when the
# kill landed and is corrupt. RIXS is what does not fit: disable it below, or use a larger
# machine.
#
# Which spectrum dominates DEPENDS ON SIZE, so there is no single lever. PES and XPS dominate
# the small cases -- 572 s of CoO's 676 s, against 66 s for RIXS -- but RIXS overtakes them as
# the basis grows: at FeO it is 8870 s against 4349 s for PES and XPS together, and at MnO it
# is what exhausts memory. Cost also tracks the retained-state count, not just the determinant
# count, since RIXS work is per eigenstate.
#
# Each spectrum has its own switch below, so the expensive one can be dropped:
# `[spectroscopy.rixs] enabled = false` is the lever for the large fillings, and
# `[spectroscopy.pes] / [spectroscopy.xps]` for the small ones. Turning PES and XPS off took
# NiO's 10-bath model from minutes to 7 seconds.

[spectroscopy]
# NOTE: run_Mn_MnO_CF.sh passed --nPsiMax, which run_spectra does not read -- the number of
# eigenstates is derived from the temperature. It is therefore not expressible here, rather
# than expressed and ignored.

[spectroscopy.pes]
enabled = true

[spectroscopy.xps]
enabled = true

[spectroscopy.xas]
enabled = true

[spectroscopy.rixs]
enabled = true

[spectroscopy.nixs]
enabled = false
# radial_file = "../radialOrbitals/Mn3d.dat"   # required when enabled
