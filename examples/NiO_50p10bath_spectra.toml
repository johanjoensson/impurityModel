# =========================================================================================
# KNOWN BROKEN -- this workload does not currently solve. Kept because it is a faithful
# translation of scripts/run_Ni_NiO_50p10bath.sh, so whoever fixes the underlying bug has
# the input to reproduce it with.
#
# What happens: the ground-state search returns the ENTIRE d8 manifold, 45 = C(10,8)
# determinants, exactly degenerate at E0 = 0.000000, instead of a handful of low-lying
# states. The recorded state shows why -- the bath occupation comes back as
# [impurity, valence, conduction] = [14, 10, 10]: ten valence bath orbitals occupied rather
# than fifty, and the conduction bath full rather than empty. The spectra stage then tries
# all 45 eigenstates at once and is killed by the OOM killer (measured: 3.7 GB per rank,
# four ranks, 15 GB machine).
#
# NOT caused by the input format. The identical result comes from the old command line,
#     impurityModel spectra h0/h0_NiO_50p10bath.pickle --nBaths 0 60 --nValBaths 0 10
# with no input file involved, and it is unchanged by supplying an explicit
# zeeman_splitting. The model itself builds correctly: the 3d block sits at -106.5 eV split
# by 0.37 eV, hybridization reaches 1.87 eV, and the bath splits 50 valence / 10 conduction
# as it should. The failure is downstream of the model, in the many-body basis.
#
# examples/NiO_10bath_spectra.toml is the working fitted-bath example.
# =========================================================================================

# Ni in NiO -- L2,3 spectra from a fitted bath: 50 valence + 10 conduction bath states.
# Replaces scripts/run_Ni_NiO_50p10bath.sh.
#
# Run with:   mpirun -n <ranks> impurityModel run examples/NiO_50p10bath_spectra.toml

[format]
version = [1, 0]

[units]
energy = "eV"

[hamiltonian.file]
# A legacy labelled .pickle: it records no bath layout, so the counts below cannot be
# deduced and have to be written out. A self-describing .h0 would supply them.
path = "../h0/h0_NiO_50p10bath.pickle"

[[shell]]
l = 1
role = "core"
nominal_occupation = 6
soc = 11.629
# n_bath is omitted: no Hamiltonian is read for the core shell, so it has no fitted bath.
# Set it if you do want core bath states -- the default is a default, not a restriction.

[[shell]]
l = 2
role = "valence"
n_bath = 60
n_valence_bath = 10
nominal_occupation = 8
soc = 0.096

[interaction.slater]
F_vv = [7.5, 0.0, 9.9, 0.0, 6.6]
F_cc = [0.0, 0.0, 0.0]
F_cv = [8.9, 0.0, 6.8]
G_cv = [0.0, 5.0, 0.0, 2.8]

[double_counting.mlft]
c = 1.5

[spectroscopy]

[spectroscopy.pes]
enabled = true

[spectroscopy.xps]
enabled = true

[spectroscopy.xas]
enabled = true

[spectroscopy.rixs]
enabled = true

[spectroscopy.nixs]
enabled = true
radial_file = "../radialOrbitals/Ni3d.dat"
