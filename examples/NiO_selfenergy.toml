# Ni in NiO -- impurity self-energy Sigma(w) and the impurity Green's function.
# There was no shell script for this: the self-energy has never had a worked example.
#
# Run with:   mpirun -n <ranks> impurityModel run examples/NiO_selfenergy.toml

[format]
version = [1, 0]

[units]
energy = "eV"

[hamiltonian.file]
path = "../h0/h0_NiO_10bath.pickle"

[[shell]]
l = 2
role = "valence"
n_bath = 10
n_valence_bath = 10
nominal_occupation = 8

[interaction.slater]
F_vv = [7.5, 0.0, 9.9, 0.0, 6.6]

[double_counting.nominal]
# NOT optional in practice. Without a double counting the bare 3d level sits far above the
# bath and the impurity empties: this model relaxes to a mean occupation of 0.57 electrons
# instead of 8, and every downstream number is then meaningless. The `nominal` scheme is FLL
# evaluated at the nominal integer occupation -- closed form, no ground-state solve, and it
# needs no reference filling so it cannot saturate on a coarse bath fit. It gives dc = 52.125
# eV here (U = 7.5, J = 1.179, N = 8) and a d8 ground state with ~10% d9 admixture.
#
# For a production NiO calculation prefer [double_counting.fixed_gap], which centres the
# double counting in the charge gap -- Karolak's prescription for a charge-transfer
# insulator, where the fixed-occupation condition breaks down because the occupation is flat
# in mu inside the gap. It runs a search: expect 1-15 full ground-state solves.
#   [double_counting.fixed_gap]
#   offset = 0.0
#   on_unreachable = "abort"

[selfenergy]
cluster = "NiO"

[selfenergy.real_axis]
enabled = true
mesh = { min = -20.0, max = 20.0, n = 801 }
broadening = 0.2

[selfenergy.matsubara]
# Fermionic: i*nu_n with nu_n = (2n+1)*pi*tau. Distinct from the susceptibility's bosonic
# mesh in both statistics and convention, which is why they are separate tables.
enabled = false
n_points = 0
